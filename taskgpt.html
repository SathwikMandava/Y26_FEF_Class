
<html>
<head>
    <title>Front End</title>

    <meta charset="UTF-8">
    <meta name="description" content="CSE Student Registration">
    <meta name="keywords" content="CSE, Registration">

    <style>
        body {
            background-color: lightgray;
        }

        h1 {
            color: red;
            text-align: center;
        }

        h2 {
            text-align: center;
        }

        .personal {
            background-color: lightblue;
            padding: 20px;
        }

        .course {
            background-color: lightgreen;
            padding: 20px;
        }
    </style>
</head>

<body>

    <h1>CSE Student Registration</h1>

    <div class="personal">
        <h2>Personal Information</h2>

        Name:
        <input type="text" placeholder="Enter Name">
        <br><br>

        Age:
        <input type="number" placeholder="Enter Age">
        <br><br>

        Email:
        <input type="email" placeholder="Enter Email">
        <br><br>

        Phone:
        <input type="text" placeholder="Enter Phone">
    </div>

    <br>

    <div class="course">
        <h2>Course Registration Details</h2>

        Department:
        <input type="text" value="CSE">
        <br><br>

        Course:
        <input type="text" placeholder="Enter Course">
        <br><br>

        Year:
        <select>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
        </select>
        <br><br>

        Semester:
        <input type="number" placeholder="Enter Semester">
        <br><br>

        <input type="submit" value="Register">
    </div>

</body>
</html>
