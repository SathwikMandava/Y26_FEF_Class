<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Tables</title>
</head>
<body>

    <table border="1"> 

        <caption> Student Marks</caption>

            <col style="background-color: lightcoral;">
            <col style="background-color: lightseagreen;">
        </colgroup>

        <thead> 
        <tr> 
            <th> Student Name</th>
            <th> subject </th>
            <th> Markks </th>
        </tr>
        </thead>

        <tbody>
        <tr>
            <td rowspan="2" style="padding: 20px;"> Harsha </td>
            <td> HTML </td>
            <td> 1000 </td>
        </tr>
        

         <tr>
            
            <td> CSS </td>
            <td> 100 </td>
        </tr>
        
         <tr>
            <td rowspan="2" style="padding: 20px;"> Sathwik </td>
            <td> HTml </td>
            <td> 100 </td>
        </tr>

         <tr>
           
            <td> CSS </td>
            <td> 99 </td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <td colspan="2"> Total Students</td>

        </tr>
        </tfoot>
    </table>
</body>
</html>
