<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeTable</title>
</head>

<body>

   <div style="display: flex; align-items: center; text-align: center;">
    
     <a href="https://newerp.kluniversity.in" >  <img src="./kl_logo.png" alt="KL LOGO" width="200" height="200">  </a>

 </div>
                      
     <H1 style=" text-align: center;"> TIME TABLE</H1>
     <h2 style="text-align: center;">  Sathwik's Time Tbale</h2>

     <table border="2" style="margin: auto; text-align: center; width: 80%; height: 400px;">

 
<tr style="background-color: skyblue;">
    <th>Oday</th>
    <th>1</th>
    <th>2</th>
    <th colspan="1" rowspan="7"> Break</th>
    <th>3</th>
    <th>4</th>
    <TH colspan="1" rowspan="7"> Break</TH>
    <th>5</th>
    <th>6</th>
</tr>
<tr style="background-color: aliceblue;">
    <td>MONDAY</td>
    <td colspan="2" rowspan="3">Maths</td>
    <td colspan="2" rowspan="2">DSA</td>
    <td colspan="2">Full stack</td>
   
</tr>
<tr>
    <td>TUESDAY</td>
    <td colspan="2">IOT</td>
    
</tr>
<tr style="background-color: aliceblue;">
    <td>WEDNESDAY</td>
    <td colspan="2" rowspan="2">IOT</td>
    <td colspan="2" rowspan="2">Full stack</td>
</tr>
<tr>
    <td>THUSDAY</td>
    <td colspan="2" rowspan="2">DSA</td>
    
    
</tr>
<tr style="background-color: aliceblue;">
    <td>FRIDAY</td>
    <td colspan="2" rowspan="2">FULLSTACK</td>
   
    <td colspan="2">CSE</td>
   
</tr>
<tr>
    <td>SATURDAY</td>
    <td colspan="2">IOT</td>
    
   
    <td>CSE</td>
    <td>DSA</td>
</tr>
</table>

</body>
</html>
